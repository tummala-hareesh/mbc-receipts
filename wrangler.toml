name            = "mbc-receipt-auth"
main            = "worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# KV namespace — create with:
#   npx wrangler kv namespace create MBC_KV
# then paste the id below
[[kv_namespaces]]
binding = "MBC_KV"
id      = "PASTE_YOUR_KV_NAMESPACE_ID_HERE"

# Environment variables (non-secret)
[vars]
FROM_EMAIL = "receipts@miltonbadmintonclub.com"
FROM_NAME  = "Milton Badminton Club"

# Secrets — set via CLI, never commit:
#   npx wrangler secret put ALLOWED_EMAILS
#   value: comma-separated list, e.g.  admin@miltonbadmintonclub.com,coach@miltonbadmintonclub.com
